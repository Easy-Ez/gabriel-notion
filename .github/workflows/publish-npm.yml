name: Package the Node.js SDK, attach it to a GitHub Release, publish to npm

# Push a tag node-v<version> (matching sdks/node/package.json) to release.
#   package  build, test, `npm pack`, rehearse `npm publish`
#   release  attach the tarball to the GitHub Release for the tag (pre-release for -alpha etc.)
#   publish  npm Trusted Publishing (OIDC from the `npm` environment; no token)

on:
  push:
    tags: ['node-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-npm-release

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - id: version
        run: echo "version=$(node -p "require('./sdks/node/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check release tag
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if [[ "$GITHUB_REF_NAME" != "node-v${{ steps.version.outputs.version }}" ]]; then
            echo "::error::The release tag must match the Node.js SDK version"
            exit 1
          fi
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm leak:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          (cd sdks/node && npm pack --pack-destination "$RUNNER_TEMP/pkg")
          ls -l "$RUNNER_TEMP/pkg"
      - name: Rehearse npm publish
        run: npm publish "$RUNNER_TEMP"/pkg/gabriel-notion-*.tgz --dry-run --force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/pkg/gabriel-notion-*.tgz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-distribution
          path: dist
      - name: Create the GitHub Release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/gabriel-notion-*.tgz \
            --repo "$GITHUB_REPOSITORY" --title "gabriel-notion $VERSION" $prerelease \
            --notes "Install: npm install https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/gabriel-notion-$VERSION.tgz"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-v') && github.repository == 'Easy-Ez/gabriel-notion'
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: npm with Trusted Publishing support (>= 11.5.1)
        run: npm install -g npm@11.6.2 && npm --version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-distribution
          path: dist
      - name: Publish the verified tarball with Trusted Publishing
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: npm publish ./dist/gabriel-notion-*.tgz $([[ "$VERSION" == *-* ]] && echo --tag next)
